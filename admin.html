<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>לוח בקרה — Skate Lab</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    /* עמוד עצמאי — לא חלק מה-SPA, לכן בלי phone-frame ועם פריסת שולחן-עבודה */
    body { display: block; }
    .admin { max-width: 960px; margin: 0 auto; padding: 32px 20px 80px; }
    .admin h1 { font-size: 22px; margin-bottom: 24px; }
    .admin__login { max-width: 360px; margin: 80px auto; text-align: center; }
    .admin__login input {
      width: 100%; padding: 12px 14px; margin: 16px 0; border-radius: var(--r-sm);
      border: 1px solid var(--line); background: var(--surface); color: var(--text); font: inherit;
    }
    .admin__tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .admin__tab {
      padding: 8px 16px; border-radius: var(--r-full); border: 1px solid var(--line);
      background: var(--surface); color: var(--muted); cursor: pointer; font: inherit;
    }
    .admin__tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--line); }
    th { color: var(--muted); font-weight: 600; font-size: 13px; }
    tr:hover td { background: var(--surface); }
    .tag { display: inline-block; padding: 2px 8px; border-radius: var(--r-full); font-size: 12px; background: var(--surface-2); }
    .del { color: var(--danger); background: none; border: none; cursor: pointer; font: inherit; font-weight: 600; }
    .del:hover { text-decoration: underline; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .err { color: var(--danger); margin-top: 12px; font-size: 14px; min-height: 20px; }
    .empty { color: var(--muted); text-align: center; padding: 40px 0; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    const $ = (sel, el = document) => el.querySelector(sel);
    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    const api = (path, opts = {}) => fetch('/api/admin' + path, {
      credentials: 'same-origin',
      headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
      ...opts,
    }).then(async (r) => {
      const data = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(data.error || 'שגיאה');
      return data;
    });

    let tab = 'users';

    async function renderLogin(err) {
      $('#root').innerHTML = `
        <div class="admin admin__login">
          <h1>🔒 לוח בקרה</h1>
          <p class="muted">סיסמת הניהול של Skate Lab</p>
          <input type="password" id="pw" placeholder="סיסמה" autofocus>
          <button class="btn btn--primary" id="go" style="width:100%">כניסה</button>
          <p class="err">${esc(err || '')}</p>
        </div>`;
      $('#go').onclick = async () => {
        try {
          await api('/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
          boot();
        } catch (e) { renderLogin(e.message); }
      };
      $('#pw').onkeydown = (e) => { if (e.key === 'Enter') $('#go').click(); };
    }

    async function renderApp() {
      $('#root').innerHTML = `
        <div class="admin">
          <div class="topbar">
            <h1>🔒 לוח בקרה</h1>
            <button class="btn btn--ghost" id="logout">יציאה</button>
          </div>
          <div class="admin__tabs">
            <button class="admin__tab" data-tab="users" aria-selected="${tab === 'users'}">משתמשים</button>
            <button class="admin__tab" data-tab="videos" aria-selected="${tab === 'videos'}">סרטונים</button>
          </div>
          <div id="body">טוען…</div>
        </div>`;

      $('#logout').onclick = async () => { await api('/logout', { method: 'POST' }); boot(); };
      document.querySelectorAll('[data-tab]').forEach((b) => {
        b.onclick = () => { tab = b.dataset.tab; renderApp(); };
      });

      if (tab === 'users') renderUsers(); else renderVideos();
    }

    async function renderUsers() {
      const rows = await api('/users');
      const body = $('#body');
      if (!rows.length) { body.innerHTML = '<p class="empty">אין משתמשים.</p>'; return; }

      body.innerHTML = `
        <table>
          <thead><tr>
            <th>שם</th><th>מייל</th><th>תפקיד</th><th>אזור</th><th>סרטונים</th><th>נרשם</th><th></th>
          </tr></thead>
          <tbody>
            ${rows.map((u) => `
              <tr data-id="${esc(u.id)}">
                <td>${esc(u.name)} ${u.isDemo ? '<span class="tag">דמו</span>' : ''}</td>
                <td class="muted">${esc(u.email || '—')}</td>
                <td>${esc(u.role)}</td>
                <td>${esc(u.region || '—')}</td>
                <td>${u.videoCount}</td>
                <td>${new Date(u.createdAt).toLocaleDateString('he-IL')}</td>
                <td><button class="del" data-del-user>מחיקה</button></td>
              </tr>`).join('')}
          </tbody>
        </table>`;

      body.querySelectorAll('[data-del-user]').forEach((btn) => {
        btn.onclick = async () => {
          const tr = btn.closest('tr');
          const name = tr.children[0].textContent.trim();
          if (!confirm(`למחוק את "${name}"? הפעולה בלתי הפיכה — כל הסרטונים והתגובות שלו יימחקו.`)) return;
          await api(`/users/${tr.dataset.id}`, { method: 'DELETE' });
          renderUsers();
        };
      });
    }

    async function renderVideos() {
      const rows = await api('/videos');
      const body = $('#body');
      if (!rows.length) { body.innerHTML = '<p class="empty">אין סרטונים.</p>'; return; }

      body.innerHTML = `
        <table>
          <thead><tr>
            <th>כותרת</th><th>מעלה</th><th>סוג</th><th>קובץ</th><th>הועלה</th><th></th>
          </tr></thead>
          <tbody>
            ${rows.map((v) => `
              <tr data-id="${esc(v.id)}">
                <td>${esc(v.title)} ${v.isDemo ? '<span class="tag">דמו</span>' : ''}</td>
                <td>${esc(v.authorName)}</td>
                <td>${v.kind === 'lesson' ? 'שיעור' : 'טריק'}</td>
                <td>${v.hasFile ? '✓' : '—'}</td>
                <td>${new Date(v.createdAt).toLocaleDateString('he-IL')}</td>
                <td><button class="del" data-del-video>מחיקה</button></td>
              </tr>`).join('')}
          </tbody>
        </table>`;

      body.querySelectorAll('[data-del-video]').forEach((btn) => {
        btn.onclick = async () => {
          const tr = btn.closest('tr');
          const title = tr.children[0].textContent.trim();
          if (!confirm(`למחוק את "${title}"?`)) return;
          await api(`/videos/${tr.dataset.id}`, { method: 'DELETE' });
          renderVideos();
        };
      });
    }

    async function boot() {
      const { enabled, loggedIn } = await api('/session').catch(() => ({ enabled: false, loggedIn: false }));
      if (!enabled) {
        $('#root').innerHTML = '<div class="admin__login"><p class="err">לוח הבקרה לא הוגדר בשרת (ADMIN_PASSWORD חסר).</p></div>';
        return;
      }
      if (!loggedIn) return renderLogin();
      renderApp();
    }

    boot();
  </script>
</body>
</html>
