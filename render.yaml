# הגדרות הפריסה ל-Render.
# Render קורא את הקובץ הזה מהמאגר ובונה לפיו את השירות — אין צורך
# למלא טפסים ביד. אחרי שינוי כאן צריך לעשות Deploy מחדש.

services:
  - type: web
    name: skate-lab
    runtime: node
    plan: free            # ללא עלות. השרת נרדם אחרי 15 דקות בלי כניסות,
                          # והכניסה הבאה מחכה כ-50 שניות עד שהוא קם.
    region: frankfurt     # הכי קרוב לישראל מבין האזורים של Render
    rootDir: server       # ה-package.json יושב בתיקיית השרת
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health

    # אין כאן disk בכוונה: התוכנית החינמית לא תומכת בדיסק קבוע, והדיסק
    # הרגיל נמחק בכל הפעלה מחדש. לכן המסד יושב ב-Neon והסרטונים
    # ב-Cloudinary — שניהם מחוץ לשרת, ושורדים כל הפעלה מחדש.

    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production  # מפעיל את דגל Secure בעוגיית הסשן

      # הערכים האלה מוגדרים בלוח הבקרה של Render, לא בקובץ הזה.
      # sync: false אומר ל-Render לבקש אותם ולא לשמור אותם ב-git.
      - key: DATABASE_URL
        sync: false        # מחרוזת החיבור מ-Neon
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: INVITE_CODE
        sync: false        # בלי קוד הזמנה נכון אי אפשר להירשם
      - key: ANTHROPIC_API_KEY
        sync: false        # בלעדיו האפליקציה עובדת, רק בלי ה-AI

      # מכסות ברירת מחדל ל-AI לכל משתמש. אפשר לשנות בלי לגעת בקוד.
      - key: AI_LIMIT_HOUR
        value: "20"
      - key: AI_LIMIT_DAY
        value: "100"
      - key: MAX_UPLOAD
        value: 60mb
